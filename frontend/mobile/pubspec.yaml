name: palabre
description: Palabre — Application de communication souveraine pour organisations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── WebSocket Phoenix ─────────────────────────────────────────────────────
  # Client Phoenix Channels natif Dart
  phoenix_socket: ^0.6.4

  # ── Chiffrement E2E (Signal Protocol) ────────────────────────────────────
  # Implémentation Dart du protocole Signal (Double Ratchet + X3DH)
  libsignal_protocol_dart: ^0.5.0
  # Chiffrement AES-256 pour les médias
  encrypt: ^5.0.3
  # Crypto utilitaires
  pointycastle: ^3.9.1

  # ── HTTP ──────────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  # Gestion du token JWT + refresh automatique
  dio_smart_retry: ^6.0.0

  # ── Stockage local ────────────────────────────────────────────────────────
  # Base de données locale SQLite (messages hors-ligne, contacts, profil)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0
  # Stockage sécurisé (clés Signal, tokens)
  flutter_secure_storage: ^9.0.0
  # Préférences simples
  shared_preferences: ^2.2.3

  # ── WebRTC (appels audio/vidéo) ───────────────────────────────────────────
  flutter_webrtc: ^0.10.3

  # ── WebView (vidéoconférence Jitsi white-label) ───────────────────────────
  webview_flutter: ^4.7.0

  # ── Auth sociale (Google, GitHub, Facebook via Firebase) ─────────────────
  google_sign_in: ^6.2.1

  # ── Notifications push ────────────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.1.2

  # ── Médias ────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  just_audio: ^0.9.38
  record: ^5.1.0           # Enregistrement audio
  camera: ^0.11.0+1

  # ── UI ───────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  timeago: ^3.6.1           # "il y a 5 min"
  badges: ^3.1.2
  shimmer: ^3.0.0           # Skeleton loading
  emoji_picker_flutter: ^2.2.0

  # ── Connectivité ─────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── UUID ─────────────────────────────────────────────────────────────────
  uuid: ^4.4.0

  # ── Permissions ──────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── QR Code (activation organisation) ────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
