name: palabre


services:

  postgres:
    image: postgres:16-alpine
    container_name: palabre-postgres
    profiles: ["postgres", "core", "all"]
    environment:
      POSTGRES_USER: palabre
      POSTGRES_PASSWORD: palabre
      POSTGRES_DB: palabre
    volumes:
      - palabre_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palabre"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: palabre-redis
    profiles: ["redis", "core", "all"]
    ports:
      - "6380:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: palabre-backend
    profiles: ["backend", "core", "all"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgres://palabre:palabre@postgres:5432/palabre
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "4001:4000"
    volumes:
      - ../backend/src:/app/src
      - ../backend/migrations:/app/migrations
      - palabre_uploads:/app/uploads
      # Clé de service Firebase (et tout autre secret fichier) : déposez-la
      # dans backend/secrets/ (ignoré par git), elle apparaît en lecture
      # seule dans /run/secrets du conteneur.
      - ../backend/secrets:/run/secrets:ro

  frontend-web:
    build:
      context: ../frontend/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4001/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_MESSAGE_ROUTER_URL: ${VITE_MESSAGE_ROUTER_URL:-ws://localhost:4020}
    container_name: palabre-frontend-web
    profiles: ["frontend", "frontend-web", "all"]
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # frontend-mobile n'est pas un service Docker au sens propre (application
  # React Native compilée en APK, voir palabre/frontend/mobile) : elle n'a
  # donc pas d'entrée ici, mais son dossier existe au même niveau que les
  # autres modules pour respecter l'arborescence demandée.

  mediasoup:
    build:
      context: ../mediasoup
    container_name: palabre-mediasoup
    profiles: ["mediasoup", "telephony", "all"]
    ports:
      - "3478:3478/udp"

  asterisk:
    build:
      context: ../asterisk
    container_name: palabre-asterisk
    profiles: ["asterisk", "telephony", "all"]
    depends_on:
      - mediasoup

  ai:
    build:
      context: ../ai
    container_name: palabre-ai
    profiles: ["ai", "all"]
    # STT / TTS / LLM hébergés localement (voir section 37 du cahier des charges)

  wireguard:
    build:
      context: ../wireguard
    container_name: palabre-wireguard
    profiles: ["wireguard", "vpn", "all"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"

  # ── Services temps réel (Phase 1 — messagerie) ──────────────────────────────

  coturn:
    build:
      context: ../coturn
      dockerfile: Dockerfile
    container_name: palabre-coturn
    profiles: ["coturn", "realtime", "all"]
    network_mode: host
    environment:
      TURN_REALM:        ${TURN_REALM:-palabre.app}
      TURN_SECRET:       ${TURN_SECRET:-change_me_turn_secret}
      TURN_EXTERNAL_IP:  ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT:     "49152"
      TURN_MAX_PORT:     "65535"
      TURN_VERBOSE:      "0"
    volumes:
      - palabre_coturn_data:/var/lib/coturn
    restart: unless-stopped

  presence:
    build:
      context: ../services/presence
      dockerfile: Dockerfile
    container_name: palabre-presence
    profiles: ["presence", "realtime", "all"]
    environment:
      PRESENCE_HTTP_PORT: "4010"
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - palabre_mnesia_data:/app/data

  message-router:
    build:
      context: ../services/message-router
      dockerfile: Dockerfile
    container_name: palabre-message-router
    profiles: ["message-router", "realtime", "all"]
    environment:
      DATABASE_URL: postgres://palabre:palabre@postgres:5432/palabre
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      PRESENCE_SERVICE_URL: http://presence:4010
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      MESSAGE_ROUTER_PORT: "4020"
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PHOENIX_SECRET_KEY_BASE: ${PHOENIX_SECRET_KEY_BASE:-palabre_dev_secret_key_base_change_in_prod_must_be_64_chars_minimum_xxxxx}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4020:4020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      presence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4020/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-server:
    build:
      context: ../services/file-server
      dockerfile: Dockerfile
    container_name: palabre-file-server
    profiles: ["file-server", "realtime", "all"]
    environment:
      FILE_SERVER_PORT: "4030"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      FILE_SERVER_PUBLIC_URL: ${FILE_SERVER_PUBLIC_URL:-http://localhost:4030}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "4030:4030"
    volumes:
      - palabre_media_storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4030/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  call-signal:
    build:
      context: ../services/call-signal
      dockerfile: Dockerfile
    container_name: palabre-call-signal
    profiles: ["call-signal", "realtime", "all"]
    environment:
      CALL_SIGNAL_PORT: "4040"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      MEDIASOUP_URL: http://mediasoup:3478
      MESSAGE_ROUTER_URL: http://message-router:4020
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PHOENIX_SECRET_KEY_BASE: ${PHOENIX_SECRET_KEY_BASE:-palabre_dev_secret_key_base_change_in_prod_must_be_64_chars_minimum_xxxxx}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4040:4040"
    depends_on:
      message-router:
        condition: service_healthy
      mediasoup:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  palabre_postgres_data:
  palabre_uploads:
  palabre_mnesia_data:
  palabre_media_storage:
  palabre_coturn_data:
