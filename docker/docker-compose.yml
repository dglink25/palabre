name: palabre


services:

  postgres:
    # pgvector/pgvector:pg16 inclut l'extension pgvector requise par le service AI
    image: pgvector/pgvector:pg16
    container_name: palabre-postgres
    profiles: ["postgres", "core", "all"]
    environment:
      POSTGRES_USER: palabre
      POSTGRES_PASSWORD: palabre
      POSTGRES_DB: palabre
    volumes:
      - palabre_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palabre"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: palabre-redis
    profiles: ["redis", "core", "all"]
    ports:
      - "6380:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: palabre-backend
    profiles: ["backend", "core", "all"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgres://palabre:palabre@postgres:5432/palabre
      REDIS_URL: redis://redis:6379
      MESSAGE_ROUTER_INTERNAL_URL: http://message-router:4020
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_healthy
    ports:
      - "4001:4000"
    volumes:
      - ../backend/src:/app/src
      - ../backend/migrations:/app/migrations
      - palabre_uploads:/app/uploads
      - palabre_reports:/data/reports
      - ../backend/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  frontend-web:
    build:
      context: ../frontend/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4001/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_MESSAGE_ROUTER_URL: ${VITE_MESSAGE_ROUTER_URL:-ws://localhost:4020}
    container_name: palabre-frontend-web
    profiles: ["frontend", "frontend-web", "all"]
    ports:
      - "3000:3000"
    depends_on:
      - backend

  frontend-developer:
    build:
      context: ../frontend/developer
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4001/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_PALABRE_BASE_URL: ${VITE_PALABRE_BASE_URL:-http://localhost:3000}
        VITE_DEVELOPER_PORTAL_URL: ${VITE_DEVELOPER_PORTAL_URL:-http://localhost:3001}
    container_name: palabre-frontend-developer
    profiles: ["frontend", "frontend-developer", "all"]
    ports:
      - "3001:3001"
    depends_on:
      - backend

  # frontend-mobile n'est pas un service Docker au sens propre (application
  # Flutter compilée en APK/IPA). Elle se build localement avec :
  #   cd frontend/mobile && flutter pub get
  #   flutter run --dart-define=API_BASE_URL=http://localhost:4001/api/v1 ...
  # Voir frontend/mobile/README.md pour les instructions complètes.

  mediasoup:
    build:
      context: ../mediasoup
    container_name: palabre-mediasoup
    profiles: ["mediasoup", "telephony", "all"]
    ports:
      - "3478:3478/udp"

  asterisk:
    build:
      context: ../asterisk
    container_name: palabre-asterisk
    profiles: ["asterisk", "telephony", "all"]
    depends_on:
      - mediasoup

  ai:
    build:
      context: ../ai
    container_name: palabre-ai
    profiles: ["ai", "core", "all"]
    env_file: ../ai/.env
    environment:
      DATABASE_URL: postgres://palabre:palabre@postgres:5432/palabre
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - palabre_ai_data:/data
      - palabre_recordings:/recordings:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  wireguard:
    build:
      context: ../wireguard
    container_name: palabre-wireguard
    profiles: ["wireguard", "vpn", "all"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"

  # ── Services temps réel (Phase 1 - messagerie) ──────────────────────────────

  coturn:
    build:
      context: ../coturn
      dockerfile: Dockerfile
    container_name: palabre-coturn
    profiles: ["coturn", "realtime", "core", "all"]
    network_mode: host
    environment:
      TURN_REALM:        ${TURN_REALM:-palabre.app}
      TURN_SECRET:       ${TURN_SECRET:-change_me_turn_secret}
      TURN_EXTERNAL_IP:  ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT:     "49152"
      TURN_MAX_PORT:     "65535"
      TURN_VERBOSE:      "0"
    volumes:
      - palabre_coturn_data:/var/lib/coturn
    restart: unless-stopped

  presence:
    build:
      context: ../services/presence
      dockerfile: Dockerfile
    container_name: palabre-presence
    profiles: ["presence", "realtime", "core", "all"]
    environment:
      PRESENCE_HTTP_PORT: "4010"
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    volumes:
      - palabre_mnesia_data:/app/data
    restart: unless-stopped

  message-router:
    build:
      context: ../services/message-router
      dockerfile: Dockerfile
    container_name: palabre-message-router
    profiles: ["message-router", "realtime", "core", "all"]
    environment:
      DATABASE_URL: postgres://palabre:palabre@postgres:5432/palabre
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      PRESENCE_SERVICE_URL: http://presence:4010
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      MESSAGE_ROUTER_PORT: "4020"
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PHOENIX_SECRET_KEY_BASE: ${PHOENIX_SECRET_KEY_BASE:-palabre_dev_secret_key_base_change_in_prod_must_be_64_chars_minimum_xxxxx}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4020:4020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      presence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4020/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  file-server:
    build:
      context: ../services/file-server
      dockerfile: Dockerfile
    container_name: palabre-file-server
    profiles: ["file-server", "realtime", "core", "all"]
    environment:
      FILE_SERVER_PORT: "4030"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      FILE_SERVER_PUBLIC_URL: ${FILE_SERVER_PUBLIC_URL:-http://localhost:4030}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "4030:4030"
    volumes:
      - palabre_media_storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4030/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  call-signal:
    build:
      context: ../services/call-signal
      dockerfile: Dockerfile
    container_name: palabre-call-signal
    profiles: ["call-signal", "realtime", "core", "all"]
    environment:
      CALL_SIGNAL_PORT: "4040"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      MEDIASOUP_URL: http://mediasoup:3478
      MESSAGE_ROUTER_URL: http://message-router:4020
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-dev_internal_secret}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PHOENIX_SECRET_KEY_BASE: ${PHOENIX_SECRET_KEY_BASE:-palabre_dev_secret_key_base_change_in_prod_must_be_64_chars_minimum_xxxxx}
      RELEASE_COOKIE: ${ERLANG_COOKIE:-palabre_erlang_cookie}
    ports:
      - "4040:4040"
    depends_on:
      message-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  palabre_postgres_data:
  palabre_uploads:
  palabre_reports:
  palabre_mnesia_data:
  palabre_media_storage:
  palabre_coturn_data:
  palabre_ai_data:
  palabre_recordings:
